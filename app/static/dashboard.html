<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Horus</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f5f5f5; }
  </style>
</head>
<body>
  <h1>📊 Últimas Detecções</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Câmera</th>
        <th>Face</th>
        <th>Duração</th>
        <th>Horário</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="5">Carregando...</td></tr>
    </tbody>
  </table>

  <script>
    async function fetchDetections() {
      const res = await fetch("/dashboard/");
      const data = await res.json();
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='5'>Nenhuma detecção encontrada.</td></tr>";
        return;
      }

      data.forEach(d => {
        const row = `
          <tr>
            <td>${d.id}</td>
            <td>${d.camera_id}</td>
            <td>${d.face_id}</td>
            <td>${d.duration}s</td>
            <td>${new Date(d.timestamp).toLocaleString()}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    fetchDetections();
  </script>
</body>
</html>
